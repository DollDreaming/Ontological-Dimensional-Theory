site_name: 존재론적 차원이론 위키
site_description: 존재가 스스로를 확정하고, 잇고, 넓혀 가는 과정을 1성부터 9성까지 아홉 단계로 해석하는 존재론적 차원이론(ODT)의 공개 위키
site_author: 서원용

# 저장소 이름을 바꾸면 아래 두 주소도 같이 바꾸세요.
site_url: https://dolldreaming.github.io/Ontological-Dimensional-Theory/
repo_url: https://github.com/DollDreaming/Ontological-Dimensional-Theory
repo_name: DollDreaming/Ontological-Dimensional-Theory
edit_uri: edit/main/docs/

copyright: >
  © 2025–2026 서원용 (Seo Won-Yong) ·
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ko">CC BY-NC-SA 4.0</a>

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false

nav:
  - 대문: index.md
  - 핵심 원리:
      - principles/index.md
      - 연결 구조: principles/linked-structure.md
      - 시간: principles/time.md
  - 1~9성:
      - dimensions/index.md
      - 1성 · 점: dimensions/1-point.md
      - 2성 · 선: dimensions/2-line.md
      - 3성 · 면: dimensions/3-plane.md
      - 4성 · 입체: dimensions/4-volume.md
      - 5성 · 다층: dimensions/5-multilayer.md
      - 6성 · 방향: dimensions/6-flow.md
      - 7성 · 중심: dimensions/7-center.md
      - 8성 · 반향: dimensions/8-resonance.md
      - 9성 · 종합: dimensions/9-synthesis.md
  - 해석:
      - interpretations/index.md
      - 물리학: interpretations/physics.md
      - 정보이론: interpretations/information.md
      - 의식과 자아: interpretations/mind.md
      - 학문 통합: interpretations/disciplines.md
      - 인공지능: interpretations/agi.md
  - 연구:
      - 열린 과제: research/open-problems.md
      - 판본 이력: research/versions.md
  - 용어집: glossary.md
  - 이 위키에 대해: about.md
